<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/core.css">
</head>
<body>

  <!-- ── NAVIGATION ──────────────────────────────────────── -->
  <nav class="ii-nav" role="navigation" aria-label="Main navigation">
    <a class="ii-brand" href="index.html">
      <span class="ii-mark">
        <svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
          <rect width="30" height="30" fill="#E8272A"/>
          <polygon points="11,8 22,15 11,22" fill="#EDEBE4"/>
        </svg>
      </span>
      <span class="ii-pub-wrap">
        <span class="ii-pub">Industry Insights</span>
        <span class="ii-sub">Twinfang · Internal</span>
      </span>
    </a>
    <div class="ii-nav-links">
      <a class="ii-navlink" href="index.html"       data-page="index.html">Latest Issue</a>
      <a class="ii-navlink" href="archive.html"     data-page="archive.html">Archive</a>
      <a class="ii-navlink" href="conferences.html" data-page="conferences.html">Conferences</a>
      <a class="ii-navlink" href="todos.html"       data-page="todos.html">To-Dos</a>
    </div>
    <div class="ii-nav-right">
      <button class="ii-mode" id="ii-mode" aria-label="Toggle dark mode"></button>
    </div>
  </nav>

  <!-- ── MAIN ─────────────────────────────────────────────── -->
  <main>
    <div class="ii-page">

      <div class="ii-issue-header" style="padding-top:32px">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div>
            <span class="ii-eyebrow">All Issues</span>
            <h1 class="ii-h2">Archive</h1>
          </div>
          <a class="ii-btn" href="sources.html" style="font-size:11px;margin-bottom:4px">Source Registry →</a>
        </div>
      </div>

      <!-- Archive list — populated by automation after each issue publishes -->
      <div id="ii-archive-list">

        <!-- Empty state — no issues published yet -->
        <div class="ii-empty">
          <div class="ii-empty-mark"></div>
          <h3>No Issues Yet</h3>
          <p>Published issues will appear here automatically after each editorial cycle completes.</p>
          <span class="ii-empty-hint">Twice-monthly · 1st & 15th</span>
        </div>

        <!-- ─────────────────────────────────────────────────
             ISSUE CARD TEMPLATE
             Each published issue gets a card here.
             Generated by the build workflow.
             ─────────────────────────────────────────────────
        <a class="ii-issue-card" href="issues/001/index.html">
          <div class="ii-issue-card-meta">
            <div class="ii-issue-badge">Issue 001 · May 1, 2026</div>
            <div class="ii-issue-headline">State of the Industry</div>
            <div class="ii-issue-teaser">Studio consolidations accelerate, Midjourney launches video, XDS outsourcing demand spikes.</div>
          </div>
          <span class="ii-issue-arrow">→</span>
        </a>
        -->

      </div>

    </div>
  </main>

  <!-- ── FOOTER ───────────────────────────────────────────── -->
  <div class="ii-footer-wrap">
    <footer class="ii-footer">
      <span class="ii-footer-l">Twinfang — Confidential</span>
      <span class="ii-footer-r">Industry Insights · 2026</span>
    </footer>
  </div>

  <script src="assets/js/core.js"></script>
</body>
</html>
