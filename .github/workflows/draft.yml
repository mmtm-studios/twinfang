name: Generate Draft

on:
  workflow_dispatch:
    # Triggered by Gate 1 "Proceed to Drafting" button in the browser

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate draft
        run: node scripts/draft.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit draft
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/draft.json
          git diff --staged --quiet || git commit -m "chore: draft $(date +%Y-%m-%d)"
          git push
