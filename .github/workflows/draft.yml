name: Generate Draft

on:
  workflow_dispatch:
    inputs:
      generation_id:
        description: Gate 1 generation identifier
        required: true
        type: string
      collection_id:
        description: Collection identifier approved at Gate 1
        required: true
        type: string

concurrency:
  group: industry-insights-draft
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate draft
        run: node scripts/draft.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GENERATION_ID: ${{ inputs.generation_id }}
          COLLECTION_ID: ${{ inputs.collection_id }}

      - name: Commit draft
        run: |
          git fetch origin main
          node scripts/verify-generation.js "${{ inputs.generation_id }}" origin/main "${{ inputs.collection_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/draft.json
          git diff --staged --quiet || git commit -m "chore: draft $(date +%Y-%m-%d)"
          git push
