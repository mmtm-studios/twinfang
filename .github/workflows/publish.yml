name: Publish Issue

on:
  workflow_dispatch:
    inputs:
      generation_id:
        description: Verified draft generation identifier
        required: true
        type: string
      collection_id:
        description: Collection identifier carried by the approved draft
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build issue HTML
        run: node scripts/publish.js
        env:
          GENERATION_ID: ${{ inputs.generation_id }}
          COLLECTION_ID: ${{ inputs.collection_id }}

      - name: Commit and push published files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/meta.json data/archive.json issue-*.html
          git diff --staged --quiet || git commit -m "feat: publish issue $(node -e "const m=require('./data/meta.json');console.log(m.nextIssue-1)")"
          git push origin main
