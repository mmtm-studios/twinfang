name: Collect Industry Insights

on:
  schedule:
    # 8am UTC on the 1st and 15th of every month (~every 2 weeks)
    - cron: '0 8 1,15 * *'
  workflow_dispatch:
    # Also triggerable manually from the Actions tab for testing

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run collection script
        run: node scripts/collect.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:      ${{ secrets.NOTIFY_EMAIL }}
          GH_PAGES_URL:      https://mmtm-studios.github.io/twinfang

      - name: Commit updated stories and meta
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stories.json data/meta.json
          git diff --staged --quiet || git commit -m "chore: collect $(date +%Y-%m-%d)"
          git push
